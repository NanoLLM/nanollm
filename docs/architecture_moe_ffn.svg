<text x="660.0" y="681" class="head" text-anchor="middle">Gated combine</text>
<text x="660.0" y="708" class="body" text-anchor="middle">out = Σ gate_i · Expert_i(x); gates = softmax over selected logits</text>
<path d="M980 358H1240V696H1220" class="edge dash"/>
<text x="1228" y="630" class="small" text-anchor="end">Gate weights</text>
<rect x="100" y="804" width="430" height="108" rx="14" fill="#fff8ec" stroke="#d9a441" stroke-width="2"/>
<text x="315.0" y="835" class="head" text-anchor="middle">Shared expert</text>
<text x="315.0" y="862" class="body" text-anchor="middle">FFN(D, shared_d_ff) — always active</text>
<text x="315.0" y="886" class="body" text-anchor="middle">Original diagram config: shared_d_ff = 64</text>
<path d="M210 382H40V858H100" class="edge dash"/>
<circle cx="660" cy="858" r="18" fill="white" stroke="#2d4f8b" stroke-width="2"/>
<text x="660" y="865" class="head" text-anchor="middle">+</text>
<path d="M660 742V840" class="edge"/>
<path d="M530 858H642" class="edge"/>
<rect x="790" y="814" width="430" height="88" rx="14" fill="#ffffff" stroke="#8ea0bf" stroke-width="2"/>
<text x="1005.0" y="845" class="head" text-anchor="middle">MoE output</text>
<text x="1005.0" y="872" class="body" text-anchor="middle">[B·T, D] → transformer residual add</text>
<path d="M678 858H790" class="edge"/>
<rect x="60" y="958" width="1200" height="314" rx="20" fill="white" stroke="#ced8e8" stroke-width="2"/>
<text x="84" y="991" class="head" text-anchor="start">Storage, compute &amp; working memory</text>
<text x="84" y="1026" class="body" text-anchor="start">• Stored FFN capacity: E × d_ff + shared_d_ff; active work: top_k experts + shared expert.</text>
<text x="84" y="1058" class="body" text-anchor="start">• All expert weights remain in flash (PROGMEM int8); selected weights are read during matmul.</text>
<text x="84" y="1090" class="body" text-anchor="start">• The ESP32 runtime reuses an expert activation workspace instead of holding every expert’s activations.</text>
<text x="84" y="1122" class="body" text-anchor="start">• Top-1 uses argmax; top_k &gt; 1 uses top-k selection and softmax gates over selected logits.</text>
<text x="84" y="1154" class="small" text-anchor="start">• Original diagram configuration: E=4, top_k=1, shared_d_ff=64, d_ff=128, D=32, 124 layers, context=512.</text>
<text x="84" y="1186" class="small" text-anchor="start">  Original estimates: ~5.6M parameters, ~5.5 MiB int8 weights, ~1.6× dense FFN per-token cost.</text>
<text x="84" y="1218" class="small" text-anchor="start">Reference: scripts/moe_tradeoff_estimator.py and MOE_CARDPUTER_RESEARCH.md</text>
</svg>