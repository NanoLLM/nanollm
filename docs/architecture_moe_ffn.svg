<text x="660" y="85" class="sub" text-anchor="middle">python/model.py · MoEFeedForward · token-level routing in the transformer FFN slot</text>
<rect x="60" y="120" width="1200" height="118" rx="20" fill="white" stroke="#ced8e8" stroke-width="2"/>
<text x="84" y="153" class="head" text-anchor="start">Inside a pre-norm transformer block</text>
<text x="660" y="189" class="body" text-anchor="middle">Residual stream → LayerNorm → MoE FFN → residual add → output [B·T, D]</text>
<rect x="70" y="290" width="280" height="92" rx="14" fill="#ffffff" stroke="#8ea0bf" stroke-width="2"/>
<text x="210.0" y="321" class="head" text-anchor="middle">Normalized token state</text>
<text x="210.0" y="348" class="body" text-anchor="middle">x [B·T, D]</text>
<rect x="395" y="290" width="270" height="92" rx="14" fill="#eef5ff" stroke="#6b8fcf" stroke-width="2"/>
<text x="530.0" y="321" class="head" text-anchor="middle">Router</text>
<text x="530.0" y="348" class="body" text-anchor="middle">Linear(D → E, bias=False)</text>
<rect x="710" y="290" width="270" height="92" rx="14" fill="#eefbf8" stroke="#53a79b" stroke-width="2"/>
<text x="845.0" y="321" class="head" text-anchor="middle">Top-k selection</text>
<text x="845.0" y="348" class="body" text-anchor="middle">Router logits [B·T, E]</text>
<path d="M350 336H395" class="edge"/>
<path d="M665 336H710" class="edge"/>
<text x="1030" y="322" class="small" text-anchor="start">Cardputer: E=4</text>
<text x="1030" y="349" class="small" text-anchor="start">top_k=1</text>
<text x="100" y="413" class="body" text-anchor="start">Routed experts: dense feed-forward networks</text>
<text x="100" y="436" class="small" text-anchor="start">Linear(D → d_ff) → GELU → Linear(d_ff → D)</text>
<rect x="100" y="480" width="250" height="104" rx="14" fill="#f2fbf1" stroke="#70a95e" stroke-width="2"/>
<text x="225.0" y="511" class="head" text-anchor="middle">Expert 0</text>
<text x="225.0" y="538" class="body" text-anchor="middle">FFN(D, d_ff)</text>
<text x="225.0" y="562" class="body" text-anchor="middle">Runs only when selected</text>
<path d="M225 450V480" class="edge"/>
<path d="M225 584V650" class="edge"/>
