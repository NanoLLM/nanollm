[platformio]
default_envs = m5stack_cardputer_nopsram

[env_common]
# Shared configuration for Cardputer builds.
platform = espressif32@6.4.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200

build_flags =
    ; -DNANOLLM_USE_EMBEDDED_VOCAB
    ; -DNANOLLM_USE_EMBEDDED_WEIGHTS
    -O3
    -DARDUINO_ESP32_DEV
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
    -DSCK=36
    -DMISO=37
    -DMOSI=35
    -DSS=34
    -I${PROJECT_BUILD_DIR}/${PIOENV}/config
    -I${PROJECT_PACKAGES_DIR}/framework-arduinoespressif32/tools/sdk/esp32s3/dio_opi/include
    -I${PROJECT_PACKAGES_DIR}/framework-arduinoespressif32/tools/sdk/esp32s3/dio_qspi/include
    -I${PROJECT_PACKAGES_DIR}/framework-arduinoespressif32/tools/sdk/esp32s3/opi_opi/include
    -I${PROJECT_PACKAGES_DIR}/framework-arduinoespressif32/tools/sdk/esp32s3/opi_qspi/include
    -I${PROJECT_PACKAGES_DIR}/framework-arduinoespressif32/tools/sdk/esp32s3/qio_opi/include
    -I${PROJECT_PACKAGES_DIR}/framework-arduinoespressif32/tools/sdk/esp32s3/qio_qspi/include
    # -DNANOLLM_USE_EMBEDDED_WEIGHTS
    # -DNANOLLM_USE_EMBEDDED_VOCAB
    # Phase 1 inference speed optimizations
    -ffast-math              ; Allow FP reassociation, sqrt/exp optimizations
    -funsafe-math-optimizations
    -funroll-loops           ; Unroll small loops automatically
    -ftree-vectorize         ; Enable auto-vectorization where possible
    -DNANOLLM_OPTIMIZED_OPS  ; Enable optimized ops header (GELU LUT, fast rsqrt, etc.)

build_unflags =
    -std=gnu++11

lib_deps =
    https://github.com/m5stack/M5Cardputer.git
    https://github.com/m5stack/M5Unified.git#0.2.11
    https://github.com/m5stack/M5GFX.git#0.2.17
    bblanchon/ArduinoJson@^6.21.0

build_src_flags =
    -Wall

board_build.partitions = default.csv
board_build.filesystem = spiffs

[env:m5stack_cardputer]
extends = env_common
build_flags =
    ; -DNANOLLM_USE_EMBEDDED_VOCAB
    ; -DNANOLLM_USE_EMBEDDED_WEIGHTS
    ${env_common.build_flags}
    -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi

[env:m5stack_cardputer_nopsram]
extends = env_common
upload_speed = 115200
build_flags =
    -DNANOLLM_USE_EMBEDDED_VOCAB
    -DNANOLLM_USE_EMBEDDED_WEIGHTS
    ${env_common.build_flags}
    -DNANOLLM_NO_PSRAM
board_build.menu.PSRAM = disabled
board_build.partitions = partitions_embedded.csv

